name: RaceDay Part 2 CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and run automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore API dependencies
        run: dotnet restore RACEDAY.API/RACEDAY.API.csproj

      - name: Restore test dependencies
        run: dotnet restore RaceDay.Api.Tests/RaceDay.Api.Tests.csproj

      - name: Build API
        run: dotnet build RACEDAY.API/RACEDAY.API.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --configuration Release --no-restore

      - name: Run automated tests
        env:
          Jwt__Key: "RaceDayTestSigningKey-OnlyForAutomatedTests-2026!"
          Jwt__Issuer: "RaceDay.Tests"
          Jwt__Audience: "RaceDay.Tests"
        run: dotnet test RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
